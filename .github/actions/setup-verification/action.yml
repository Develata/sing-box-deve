name: Set up verification tools
description: Shared tool versions for CI, full regression and release verification
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24' # Active LTS; review the major when a new LTS is released.
        check-latest: true
        package-manager-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14' # Stable; never select a prerelease implicitly.
        check-latest: true
        cache: pip
        cache-dependency-path: scripts/requirements-ci.txt
    - name: Install pinned verification tools
      shell: bash
      run: |
        timeout --kill-after=15s 180s python3 -m pip install \
          --disable-pip-version-check --no-input --only-binary=:all: \
          --timeout=15 --retries=2 -r scripts/requirements-ci.txt
        shellcheck --version
        python3 --version
        node --version
