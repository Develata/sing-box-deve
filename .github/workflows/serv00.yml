name: Serv00 SSH Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serv00-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: serv00
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SSH client tools
        run: |
          sudo env PROJECT_ROOT="$PWD" SBD_HOST_STATE_DIR="$RUNNER_TEMP/sbd-package-control" bash -eu -o pipefail <<'SH'
          source "$PROJECT_ROOT/lib/common.sh"
          sbd_with_mutation_lock sbd_apt_get update
          sbd_with_mutation_lock sbd_apt_get install -y sshpass jq
          SH
      - name: Deploy verified backend with pinned host keys
        env:
          SERV00_ACCOUNTS_JSON: ${{ secrets.SERV00_ACCOUNTS_JSON }}
          SERV00_KNOWN_HOSTS: ${{ secrets.SERV00_KNOWN_HOSTS }}
          SERV00_BOOTSTRAP_URL: ${{ vars.SERV00_BOOTSTRAP_URL }}
          SERV00_BOOTSTRAP_SHA256: ${{ vars.SERV00_BOOTSTRAP_SHA256 }}
          SERV00_RETRY_COUNT: '0'
        run: |
          set -euo pipefail
          umask 077
          known_hosts="$RUNNER_TEMP/serv00-known-hosts"
          trap 'rm -f "$known_hosts"' EXIT
          printf '%s\n' "$SERV00_KNOWN_HOSTS" > "$known_hosts"
          export SERV00_KNOWN_HOSTS_FILE="$known_hosts"
          test -n "$SERV00_ACCOUNTS_JSON"
          ./sing-box-deve.sh install --provider serv00 --yes
