name: Publish Runtime Release

on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful Debian Primary VPS Acceptance run for this exact commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Require real acceptance for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
        run: |
          set -euo pipefail
          [[ "$ACCEPTANCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID" > "$RUNNER_TEMP/acceptance-run.json"
          jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/primary-vps-acceptance.yml"' "$RUNNER_TEMP/acceptance-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID/jobs" > "$RUNNER_TEMP/acceptance-jobs.json"
          jq -e '[.jobs[] | select(.name == "acceptance (debian)")] | length == 1 and all(.[]; .conclusion == "success")' "$RUNNER_TEMP/acceptance-jobs.json"
      - name: Install verification tools
        run: |
          sudo timeout -k 5s 300s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15
          sudo timeout -k 5s 300s apt-get install -y shellcheck python3-yaml
      - name: Verify and build minimal runtime
        run: |
          bash scripts/sing-box-deve-pre-push.sh
          git diff --exit-code checksums.txt
          python3 scripts/runtime-archive.py pack . "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < version)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'Verified runtime for commit %s. Primary VPS acceptance run: %s.\n' "$GITHUB_SHA" "$ACCEPTANCE_RUN_ID" > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.txt" \
            "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz" "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz.sha256"
