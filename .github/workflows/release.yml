name: Publish Runtime Release

on:
  workflow_dispatch:
    inputs:
      acceptance_receipt:
        description: Sanitized SSH acceptance and restoration JSON for this exact commit and runtime SHA256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Require SSH acceptance for this commit and runtime
        env:
          SSH_ACCEPTANCE_RECEIPT: ${{ inputs.acceptance_receipt }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_ACCEPTANCE_RECEIPT" > "$RUNNER_TEMP/ssh-acceptance.json"
          python3 scripts/runtime-archive.py pack . "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz"
          python3 scripts/verify-release-receipt.py "$RUNNER_TEMP/ssh-acceptance.json" . "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz"
      - name: Install verification tools
        run: |
          sudo env PROJECT_ROOT="$PWD" SBD_HOST_STATE_DIR="$RUNNER_TEMP/sbd-package-control" bash -eu -o pipefail <<'SH'
          source "$PROJECT_ROOT/lib/common.sh"
          sbd_with_mutation_lock sbd_apt_get update
          sbd_with_mutation_lock sbd_apt_get install -y shellcheck python3-yaml
          SH
      - name: Verify and build minimal runtime
        run: |
          set -euo pipefail
          bash scripts/sing-box-deve-pre-push.sh
          git diff --exit-code checksums.txt
          python3 scripts/runtime-archive.py pack . "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz"
          python3 scripts/verify-release-receipt.py "$RUNNER_TEMP/ssh-acceptance.json" . "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < version)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > "$RUNNER_TEMP/existing-tag"; then
            echo '[ERROR] Release tag already exists; refusing to reuse it' >&2
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
          awk -v tag="$tag" 'index($0, "## [" tag "]") == 1 { selected=1; next } selected && /^## / { exit } selected { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.txt"
          test -s "$RUNNER_TEMP/release-notes.txt"
          printf '\nVerified runtime for commit %s. Debian lifecycle acceptance completed over SSH; original deployment restoration and runtime SHA256 verified. See the attached sanitized receipt.\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.txt" \
            "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz" "$RUNNER_TEMP/sing-box-deve-runtime.tar.gz.sha256" "$RUNNER_TEMP/ssh-acceptance.json"
