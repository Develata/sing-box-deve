name: Full Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install verification tools
        run: |
          sudo env PROJECT_ROOT="$PWD" SBD_HOST_STATE_DIR="$RUNNER_TEMP/sbd-package-control" bash -eu -o pipefail <<'SH'
          source "$PROJECT_ROOT/lib/common.sh"
          sbd_with_mutation_lock sbd_apt_get update
          sbd_with_mutation_lock sbd_apt_get install -y shellcheck python3-yaml
          SH
      - name: Run all local regression and current-core checks
        run: bash scripts/sing-box-deve-pre-push.sh
      - name: Check committed checksum inventory
        run: git diff --exit-code checksums.txt
