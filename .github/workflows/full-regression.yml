name: Full Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-verification
      - name: Run all local regression and current-core checks
        run: bash scripts/sing-box-deve-pre-push.sh
      - name: Check committed checksum inventory
        run: git diff --exit-code checksums.txt
