name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, regression]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-verification
      - name: Run the repository verification stage
        env:
          VERIFICATION_STAGE: ${{ matrix.stage }}
        run: bash scripts/sing-box-deve-pre-push.sh "$VERIFICATION_STAGE"
      - name: Check committed checksum inventory
        run: git diff --exit-code checksums.txt

  # Preserve the existing required check name; skipped/cancelled jobs cannot pass.
  checks:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both verification stages
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
