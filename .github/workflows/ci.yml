name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install verification tools
        run: |
          sudo timeout -k 5s 300s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15
          sudo timeout -k 5s 300s apt-get install -y shellcheck python3-yaml
      - name: Run the repository pre-push suite
        run: bash scripts/sing-box-deve-pre-push.sh
      - name: Check committed checksum inventory
        run: git diff --exit-code checksums.txt
