name: Primary VPS Acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_disposable:
        description: Authorize installation, replacement and uninstall on a disposable Debian runner
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ inputs.confirm_disposable }}
    strategy:
      fail-fast: false
      matrix:
        distro: [debian]
    runs-on: [self-hosted, Linux, sbd-disposable, '${{ matrix.distro }}']
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run real lifecycle and proxy traffic checks
        run: sudo env SBD_DISPOSABLE_ACCEPTANCE=yes SBD_EXPECT_DISTRO=${{ matrix.distro }} bash scripts/primary-vps-acceptance.sh "$RUNNER_TEMP/sbd-acceptance"
      - name: Upload sanitized acceptance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: primary-vps-${{ matrix.distro }}
          path: ${{ runner.temp }}/sbd-acceptance
          if-no-files-found: error
          retention-days: 30
